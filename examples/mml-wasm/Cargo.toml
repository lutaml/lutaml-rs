[package]
name = "mml-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Host-only replay binary used to compare native output with wasm output.
native = []

[[bin]]
name = "native_replay"
path = "src/native_replay.rs"
required-features = ["native"]

[dependencies]
lutaml-rs = { path = "../..", default-features = false, features = ["runtime", "xml"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }
wasm-bindgen = "=0.2.100"
serde-wasm-bindgen = "=0.6.5"
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"

[build-dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }
serde_yaml = "=0.9.34"
unsafe-libyaml = "=0.2.11"
sha2 = "=0.10.8"
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
